<style>
:root{
  --rosa:#FFD6E6;--rosa2:#FFB3D1;--cielo:#CFEBFF;--cielo2:#9ED8F7;--menta:#C4F3EA;--crema:#FFF8FB;
  --ciruela:#4A1F3F;--magenta:#B0125F;--oro:#C9A24B;--turq:#14B8C4;
  --ease:cubic-bezier(.2,.9,.3,1.15);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100svh;font-family:'Quicksand',system-ui,sans-serif;color:var(--ciruela);overflow-x:clip;
  background:linear-gradient(125deg,var(--rosa),var(--cielo),var(--menta),var(--rosa2),var(--cielo));background-size:400% 400%;
  animation:fondo 18s ease-in-out infinite;position:relative}
@keyframes fondo{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
/* burbujas de luz */
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;z-index:0}
body::before{background:radial-gradient(circle,#fff 0,#FFC2DD00 70%);top:-20vmax;left:-20vmax;animation:flota 14s ease-in-out infinite alternate}
body::after{background:radial-gradient(circle,#BEE6FF 0,#BEE6FF00 70%);bottom:-25vmax;right:-20vmax;animation:flota 17s ease-in-out infinite alternate-reverse}
@keyframes flota{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#dulces{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#dulces i{position:absolute;bottom:-40px;display:block;animation:sube linear infinite;opacity:.8}
@keyframes sube{to{transform:translate(var(--dx),-115vh) rotate(var(--r))}}

main{position:relative;z-index:1;width:min(100%,460px);margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;text-align:center}

/* perfil */
.perfil{position:relative;width:176px;height:176px;margin-top:6px}
.perfil img{position:absolute;inset:14px;width:148px;height:148px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 10px 30px #b0125f40;z-index:2}
.perfil svg{position:absolute;inset:0;width:100%;height:100%}
.aro1{animation:gira 28s linear infinite}.aro2{animation:gira 40s linear infinite reverse}
@keyframes gira{to{transform:rotate(360deg)}}
.perfil::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,#fff0,var(--rosa2),#fff0,var(--cielo2),#fff0);filter:blur(14px);animation:gira 9s linear infinite;opacity:.9}
.chispa{position:absolute;z-index:3;font-size:18px;animation:brilla 2.4s ease-in-out infinite}
.chispa:nth-of-type(1){top:2px;right:6px}.chispa:nth-of-type(2){bottom:10px;left:0;animation-delay:.8s}.chispa:nth-of-type(3){top:48%;right:-8px;animation-delay:1.5s;font-size:13px}
@keyframes brilla{0%,100%{transform:scale(.4) rotate(0);opacity:0}50%{transform:scale(1.1) rotate(25deg);opacity:1}}

h1{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(3.6rem,17vw,4.8rem);line-height:1.15;color:var(--magenta);margin-top:6px;padding:0 .1em;
  text-shadow:0 2px 0 #fff,0 0 22px #fff8,0 0 2px var(--oro)}
.sub{font-weight:700;letter-spacing:.34em;text-transform:uppercase;font-size:.82rem;margin-top:-2px;color:var(--ciruela)}
.lema{margin-top:10px;font-weight:600;font-size:1.05rem}
.lema b{color:var(--magenta)}

/* botones */
.links{list-style:none;padding:0;width:100%;margin-top:26px;display:grid;gap:16px}
.btn{position:relative;display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 16px 10px 12px;border-radius:999px;text-decoration:none;color:#fff;font-weight:700;font-size:1.2rem;text-align:left;overflow:hidden;
  transition:transform .35s var(--ease);-webkit-tap-highlight-color:transparent;isolation:isolate}
.btn:hover{transform:translateY(-4px) scale(1.02)}.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--ciruela);outline-offset:3px}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,#fff0 30%,#ffffff70 50%,#fff0 70%);transform:translateX(-120%);animation:brillo 4.5s ease-in-out infinite;z-index:-1}
@keyframes brillo{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.ico{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;transition:transform .5s var(--ease)}
.btn:hover .ico{transform:rotate(-12deg) scale(1.12)}
.ico svg{width:26px;height:26px}
.txt{flex:1;line-height:1.15}.txt small{display:block;font-weight:600;font-size:.82rem;opacity:.92;margin-top:2px}
.flecha{flex:none;width:22px;height:22px;transition:transform .3s}.btn:hover .flecha{transform:translateX(5px)}
/* luz de cada red */
.tt{background:#1B0F1E;animation:luzTT 2.8s ease-in-out infinite}
@keyframes luzTT{0%,100%{box-shadow:-5px 0 18px #25F4EE99,5px 0 18px #FE2C5599,0 8px 26px #25F4EE44}50%{box-shadow:-9px 0 30px #25F4EE,9px 0 30px #FE2C55,0 10px 40px #FE2C5566}}
.ig{background:linear-gradient(100deg,#E1306C,#B0125F 55%,#7B2FBE);animation:luzIG 2.8s ease-in-out infinite .5s}
@keyframes luzIG{0%,100%{box-shadow:0 6px 22px #E1306C80}50%{box-shadow:0 8px 38px #E1306Ccc,0 0 0 4px #ffffff55}}
.wa{background:#0E7A55;animation:luzWA 2.8s ease-in-out infinite 1s}
@keyframes luzWA{0%,100%{box-shadow:0 6px 22px #25D36680}50%{box-shadow:0 8px 38px #25D366cc,0 0 0 4px #ffffff55}}
.pend{display:inline-block;background:#FFF176;color:#4A1F3F;font-size:.7rem;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:middle}

.pie{margin-top:30px;font-size:.85rem;font-weight:600;opacity:.85}
.pie span{font-family:'Pinyon Script',cursive;font-size:1.5rem;color:var(--magenta)}

/* salpicadura al tocar */
.sp{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:60}

/* entrada de la página */
.js .rise{opacity:0}
.ready .rise{animation:rise .8s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.92)}to{opacity:1;transform:none}}

/* carga: una torta que se arma */
.intro{display:none}
.js .intro{display:grid;place-items:center;position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--rosa),var(--cielo));cursor:pointer;
  animation:salir 1s cubic-bezier(.7,0,.2,1) 3.5s forwards}
.js.ready .intro,.intro.out{animation:salir .8s cubic-bezier(.7,0,.2,1) forwards}
@keyframes salir{to{clip-path:ellipse(0% 0% at 50% 100%);visibility:hidden}}
.intro{clip-path:ellipse(150% 150% at 50% 100%)}
.cake{width:min(62vw,250px);overflow:visible}
.cake .c{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:cae .6s var(--ease) forwards}
.cake .c1{animation-delay:.3s}.cake .c2{animation-delay:.8s}.cake .c3{animation-delay:1.3s}.cake .c4{animation-delay:1.8s}
@keyframes cae{from{opacity:0;transform:translateY(-120px) scaleY(1.3)}60%{transform:translateY(6px) scaleY(.85)}to{opacity:1;transform:none}}
.intro h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:3.2rem;color:var(--magenta);margin-top:10px;text-align:center;text-shadow:0 2px 0 #fff;opacity:0;animation:rise .8s ease 2.1s forwards}
.intro p{text-align:center;font-weight:700;font-size:.8rem;letter-spacing:.3em;text-transform:uppercase;opacity:.8}
.barra{width:150px;height:8px;border-radius:9px;background:#fff9;margin:16px auto 0;overflow:hidden}
.barra i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--rosa2),var(--cielo2));animation:carga 3.3s ease-out .1s forwards}
@keyframes carga{to{width:100%}}
.toca{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));font-size:.8rem;font-weight:600;opacity:.7}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .js .rise{opacity:1}.js .intro{display:none}#dulces{display:none}
}
</style>
</head>

<script>
(function(){
  var h=document.documentElement,intro=document.getElementById('intro');
  function listo(){h.classList.add('ready')}

  if(intro){intro.addEventListener('click',saltar);setTimeout(listo,3100)}
  var rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(rm){return}
  /* dulces flotando */
  var c=document.getElementById('dulces'),col=['#FF8FBE','#7CC9F2','#fff','#B0125F','#14B8C4','#FFD36B'];
  for(var i=0;i<26;i++){
    var e=document.createElement('i'),t=i%4,s=8+Math.random()*14;
    e.style.cssText='left:'+Math.random()*100+'%;animation-duration:'+(12+Math.random()*16)+'s;animation-delay:-'+Math.random()*20+'s;--dx:'+(Math.random()*80-40)+'px;--r:'+(Math.random()*540-270)+'deg;background:'+col[i%col.length];
    if(t==0){e.style.width=s*.4+'px';e.style.height=s*1.4+'px';e.style.borderRadius='9px'}
    else if(t==1){e.style.width=e.style.height=s+'px';e.style.borderRadius='50%';e.style.opacity=.55}
    else if(t==2){e.style.cssText+=';background:none;font-size:'+(s+6)+'px;font-style:normal';e.textContent=['🤍','💗','✦','🫧'][i%4]}
    else{e.style.width=s*.4+'px';e.style.height=s*1.3+'px';e.style.borderRadius='9px'}
    c.appendChild(e)
  }
  /* salpicadura de glaseado al tocar */
  document.addEventListener('pointerdown',function(ev){
    if(!ev.target.closest||!ev.target.closest('.btn'))return;
    for(var k=0;k<14;k++){
      var p=document.createElement('span'),a=Math.random()*6.28,d=40+Math.random()*70;
      p.className='sp';p.style.left=ev.clientX+'px';p.style.top=ev.clientY+'px';p.style.background=col[k%5];
      document.body.appendChild(p);
      var an=p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+30)+'px) scale(.2)',opacity:0}],{duration:650,easing:'cubic-bezier(.2,.8,.3,1)'});
      an.onfinish=(function(n){return function(){n.remove()}})(p)
    }
  });
})();
</script>
